name: Clinisync CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Lint, Test, and Report Coverage
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v3
        with:
          path: csv_procedure  # 👈 Force folder name to match

      - name: 🟢 Set working directory
        working-directory: ./csv_procedure
        run: echo "👉 Using working directory: $(pwd)"

      - name: 📦 Install dependencies
        working-directory: ./csv_procedure
        run: npm install

      - name: 🧼 Lint code
        working-directory: ./csv_procedure
        run: npm run lint

      - name: 🛠️ Project setup (folders + fixtures)
        working-directory: ./csv_procedure
        run: node scripts/setup.js

      - name: 🔍 Verify test fixture files
        working-directory: ./csv_procedure
        run: |
          test -f "__tests__/fixtures/case-mix-sample.xlsx"
          test -f "__tests__/fixtures/invalid.txt"

      - name: 🧪 Run tests with coverage
        working-directory: ./csv_procedure
        run: npm test

      - name: 📊 Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          token: ${{ secrets.CODECOV_TOKEN }}  # Add in repo secrets
