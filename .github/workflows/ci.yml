name: Clinisync CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Lint, Test, and Report Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Run linter
        run: npx eslint src/ --ext .js

      - name: Verify required test fixtures
        run: |
          test -f "__tests__/fixtures/case-mix-sample.xlsx"
          test -f "__tests__/fixtures/invalid.txt"

      - name: Run tests with coverage
        run: npm test

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          token: ${{ secrets.CODECOV_TOKEN }} # 🔐 Set this in GitHub repo secrets
