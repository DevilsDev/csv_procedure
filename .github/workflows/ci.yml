name: Clinisync CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Lint, Test, and Report Coverage
    runs-on: ubuntu-latest

    steps:
      - name: ✅ Checkout repository at root
        uses: actions/checkout@v3
        with:
          path: .

      - name: 🔧 Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: 📦 Install dependencies
        run: npm install

      - name: 🧼 Lint source code
        run: npm run lint

      - name: 📁 Project setup (folders + fixtures)
        run: node scripts/setup.js

      - name: ✅ Verify test fixture files
        run: |
          test -f "__tests__/fixtures/case-mix-sample.xlsx"
          test -f "__tests__/fixtures/invalid.txt"

      - name: 🧪 Run tests with coverage
        run: npm test

      - name: 📊 Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          token: ${{ secrets.CODECOV_TOKEN }} # Optional for public repos
