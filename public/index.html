<!--
  Version: 2.1.0
  Description: Frontend UI for uploading Excel files with drag-and-drop, reset, and enhanced validation.
  Author: Ali Kahwaji
-->

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clinisync API</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 2rem;
      text-align: center;
      background: #f4f4f4;
    }

    h2 {
      margin-bottom: 1rem;
    }

    .drop-zone {
      border: 2px dashed #bbb;
      border-radius: 10px;
      padding: 3rem;
      background: white;
      color: #777;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .drop-zone.dragover {
      border-color: #28a745;
      background: #f0fff5;
    }

    input[type="file"] {
      display: none;
    }

    #response {
      margin-top: 1rem;
      font-weight: bold;
      color: #333;
    }

    button {
      margin-top: 1rem;
      padding: 0.75rem 1.5rem;
      font-size: 1rem;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    #uploadBtn {
      background-color: #28a745;
      color: white;
    }

    #uploadBtn:hover {
      background-color: #218838;
    }

    #removeBtn {
      display: none;
      background-color: #dc3545;
      color: white;
      margin-left: 10px;
    }

    #removeBtn:hover {
      background-color: #c82333;
    }
  </style>
</head>
<body>
  <h2>🧾 Clinisync API</h2>

  <div class="drop-zone" id="dropZone">
    <p>Drag & drop an Excel file here, or click to upload</p>
    <input type="file" id="fileInput" accept=".xlsx,.xls,.ods" />
  </div>

  <button id="uploadBtn">Upload</button>
  <button id="removeBtn">Remove</button>
  <div id="response"></div>

  <script src="/js/upload.js"></script>
</body>
</html>
